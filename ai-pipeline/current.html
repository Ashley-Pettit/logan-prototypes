<style>
/* One quiet card on the council-blue canvas the apps use */
:root{--bg:#F3F5F8;--card:#fff;--ink:#1B2430;--muted:#566273;--rule:#DDE3EA;--brand:#003F75;--on-brand:#fff;--bad:#8E1650;--warn-bg:#fff3cd;--warn-ink:#5c4300;--warn-line:#ecd48a;--sans:Arial,Helvetica,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F141B;--card:#18202C;--ink:#E7ECF2;--muted:#A3AFBF;--rule:#2B3546;--brand:#8EC1EC;--on-brand:#06233D;--bad:#F49CC0;--warn-bg:#3a2f10;--warn-ink:#ffe3a1;--warn-line:#6b5720;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F141B;--card:#18202C;--ink:#E7ECF2;--muted:#A3AFBF;--rule:#2B3546;--brand:#8EC1EC;--on-brand:#06233D;--bad:#F49CC0;--warn-bg:#3a2f10;--warn-ink:#ffe3a1;--warn-line:#6b5720;color-scheme:dark}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
.strip{height:4px;background:linear-gradient(100deg,#003F75 0 32%,#420A42 32% 48%,#C6246B 48% 61%,#F27E35 61% 76%,#F7A042 76% 89%,#FEC95A 89%)}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-bottom:1px solid var(--warn-line);font-size:13px;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{padding-block:12vh 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;justify-items:center}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:28px 24px;box-shadow:0 8px 24px rgba(16,32,56,.07)}
h1{margin:0;font-size:22px;line-height:1.2;color:var(--brand);text-wrap:balance}
.sub{margin:6px 0 20px;color:var(--muted);font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;min-height:46px;padding:0 14px;border:1px solid var(--rule);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
input:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
button{min-height:46px;padding:0 18px;border:0;border-radius:10px;background:var(--brand);color:var(--on-brand);font:inherit;font-weight:600;cursor:pointer}
button[disabled]{opacity:.6;cursor:default}
.err{min-height:20px;margin:8px 0 0;color:var(--bad);font-size:13px}
.foot{margin-top:16px;color:var(--muted);font-size:12px}
</style>
